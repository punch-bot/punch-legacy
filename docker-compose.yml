# Punch — Pi sandbox stack.

name: ${PUNCH_STACK_NAME:-punch}

services:
  supervisor:
    build:
      context: ${PUNCH_SUPERVISOR_REPO:-https://github.com/punch-bot/supervisor.git#main}
    image: ${PUNCH_STACK_NAME:-punch}-supervisor
    env_file: .env
    environment:
      SUPERVISOR_PORT: "4100"
      SUPERVISOR_DATA_DIR: /data
      SUPERVISOR_TOKEN: ${PUNCH_SUPERVISOR_TOKEN:-}
      ROUTINE_FIRE_URL: http://bot:4098
      ROUTINE_FIRE_TOKEN: ${PUNCH_SUPERVISOR_TOKEN:-}
      COLLAB_EVENT_URL: http://bot:4098
      COLLAB_EVENT_TOKEN: ${PUNCH_SUPERVISOR_TOKEN:-}
      PUNCH_WORKSPACE_ROOT: /work
    tmpfs:
      - /tmp
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    networks:
      - edge
    volumes:
      - supervisor_state:/data
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    image: ${PUNCH_STACK_NAME:-punch}-bot
    env_file: .env
    environment:
      PUNCH_STACK_NAME: ${PUNCH_STACK_NAME:-punch}
      PUNCH_SANDBOX_IMAGE: ${PUNCH_SANDBOX_IMAGE:-${PUNCH_STACK_NAME:-punch}-sandbox:latest}
      PUNCH_SUPERVISOR_URL: ${PUNCH_SUPERVISOR_URL:-http://supervisor:4100}
      PUNCH_SUPERVISOR_TOKEN: ${PUNCH_SUPERVISOR_TOKEN:-}
      PUNCH_HOST_NAME: ${PUNCH_HOST_NAME:-discord-bot}
      PUNCH_HOST_URL: ${PUNCH_HOST_URL:-http://bot:4098}
      OPENCODE_SERVER_URL: ""
      SANDBOX_MAP: "{}"
      OPENCODE_REMOTE_DIR: /work
      OPENCODE_TIMEOUT: "60"
      OPENCODE_IDLE_TIMEOUT: "90"
      OPENCODE_MAX: "1800"
    tmpfs:
      - /tmp
    pids_limit: 256
    mem_limit: 512m
    cpus: 1
    networks:
      - edge
    ports:
      - "${PUNCH_BOT_PORT:-4098}:4098"
    volumes:
      - bot_state:/state
      - octl_bot:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - "${PUNCH_HOST_SOURCE:-/punch}:/punch:ro"
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    networks:
      - edge
    volumes:
      - ./docker/searxng-settings.yml:/etc/searxng/settings.yml
      - searxng-data:/etc/searxng
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    restart: unless-stopped
    pids_limit: 256
    mem_limit: 256m
    cpus: 0.5

networks:
  edge: {}

volumes:
  octl_bot:
  bot_state:
  searxng-data:
  supervisor_state:
