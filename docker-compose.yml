name: ${PUNCH_STACK_NAME:-punch}

services:
  bot:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    image: ${PUNCH_STACK_NAME:-punch}-bot
    env_file: .env
    environment:
      PUNCH_STACK_NAME: ${PUNCH_STACK_NAME:-punch}
      PUNCH_SANDBOX_IMAGE: ${PUNCH_SANDBOX_IMAGE:-${PUNCH_STACK_NAME:-punch}-sandbox:latest}
      PI_SERVER_URL: ""
      SANDBOX_MAP: "{}"
      PI_REMOTE_DIR: /work
      PI_TIMEOUT: "60"
      PI_IDLE_TIMEOUT: "1800"
      PI_MAX: "1800"
    tmpfs:
      - /tmp
    pids_limit: 256
    mem_limit: 512m
    cpus: 1
    networks:
      - edge
    volumes:
      - bot_state:/state
      - octl_bot:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - "${PUNCH_HOST_SOURCE:-/punch}:/punch:ro"
    restart: unless-stopped

  sandbox:
    build:
      context: .
      dockerfile: docker/sandbox.Dockerfile
    image: ${PUNCH_SANDBOX_IMAGE:-${PUNCH_STACK_NAME:-punch}-sandbox:latest}
    profiles: ["sandbox"]
    environment:
      PI_SERVER_USERNAME: ${PI_SERVER_USERNAME:-pi}
      PI_SERVER_PASSWORD: ${PI_SERVER_PASSWORD:?PI_SERVER_PASSWORD is required for sandbox services}
      PI_MODEL: ${PI_MODEL:-opencode/big-pickle}
    networks:
      - edge
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    pids_limit: 512
    mem_limit: 4g
    cpus: 3
    restart: "no"

  searxng:
    image: searxng/searxng:latest
    networks:
      - edge
    volumes:
      - ./docker/searxng-settings.yml:/etc/searxng/settings.yml
      - searxng-data:/etc/searxng
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    restart: unless-stopped
    pids_limit: 256
    mem_limit: 256m
    cpus: 0.5

networks:
  edge: {}

volumes:
  octl_bot:
  bot_state:
  searxng-data:
